const pf = new St.PageFlip(book, {
  width: pw, height: h, size: 'fixed',
  showCover: true, usePortrait: PORTRAIT, mobileScrollSupport: false,
  maxShadowOpacity: 0.5, flippingTime: 800, drawShadow: true, showPageCorners: true,
  clickEventForward: true, useMouseEvents: true, swipeDistance: 20,
  startPage: N - startP, autoSize: false, startZIndex: 1
});
pf.loadFromHTML(book.querySelectorAll('.page'));
const pageOf = i => N - i;
let cur = startP;
const placeGlow = p => {
  if (PORTRAIT) { glow.style.left = '0px'; glow.style.width = pw + 'px'; return; }
  // landscape: front cover shows on the left half, back cover on the right half
  if (p === 1) { glow.style.left = '0px'; glow.style.width = pw + 'px'; }
  else if (p === N) { glow.style.left = pw + 'px'; glow.style.width = pw + 'px'; }
  else { glow.style.left = '0px'; glow.style.width = pw * 2 + 'px'; }
};
const sync = () => {
  cur = pageOf(pf.getCurrentPageIndex());
  count.textContent = label(cur);
  prevB.disabled = cur === 1; nextB.disabled = cur === N;
  if (!PORTRAIT) wrap.style.transform = cur === 1 ? 'translateX(25%)' : cur === N ? 'translateX(-25%)' : 'none';
  placeGlow(cur); loadAround(cur);
  history.replaceState(null, '', '#p=' + cur);
};
const visible = p => (p === 1 || p === N) ? [p] : (p % 2 ? [p - 1, p] : [p, p + 1]);
pf.on('flip', () => { sync(); hideHint(); sfx('flip'); visible(cur).forEach(countUp); try { localStorage.setItem('adaa-page', cur); } catch (e) {} });
setTimeout(() => visible(cur).forEach(countUp), 700);
// remember where the reader stopped
(() => { let saved = 0; try { saved = +localStorage.getItem('adaa-page') || 0; } catch (e) {}
  if (location.hash || saved < 2 || saved > N) return;
  const r = document.getElementById('resume'); document.getElementById('rtext').textContent = `وقفت عند صفحة ${saved}، تكمل؟`;
  setTimeout(() => r.classList.add('on'), 900);
  const close = () => r.classList.remove('on');
  document.getElementById('rgo').onclick = () => { sfx('click'); close(); setTimeout(() => api.to(saved), 250); };
  document.getElementById('rno').onclick = () => { sfx('click'); close(); try { localStorage.setItem('adaa-page', 1); } catch (e) {} };
  setTimeout(close, 9000); })();
pf.on('changeState', e => { if (e.data !== 'read') hideHint(); });
sync();
// keep the arrows and the hint right under the book
const placeBar = () => {
  const r = book.getBoundingClientRect(), bar = document.querySelector('.bar'), hint = document.getElementById('hint');
  const top = Math.round(r.bottom + 26);
  bar.style.top = top + 'px'; bar.style.bottom = 'auto';
  hint.style.top = (top + 72) + 'px'; hint.style.bottom = 'auto';
};
placeBar(); requestAnimationFrame(placeBar);

// ---------- soft light that follows the finger while turning ----------
const spot = document.getElementById('spot');
const moveSpot = (x, y) => { const r = wrap.getBoundingClientRect(); spot.style.setProperty('--sx', (x - r.left) + 'px'); spot.style.setProperty('--sy', (y - r.top) + 'px'); };
let spotOn = false;
const pt = e => e.touches && e.touches[0] ? e.touches[0] : e;
wrap.addEventListener('pointerdown', e => { if (e.target.closest('a.hot')) return; spotOn = true; moveSpot(e.clientX, e.clientY); spot.classList.add('on'); }, { passive: true });
addEventListener('pointermove', e => { if (spotOn) moveSpot(e.clientX, e.clientY); }, { passive: true });
wrap.addEventListener('touchmove', e => { if (spotOn) { const q = pt(e); moveSpot(q.clientX, q.clientY); } }, { passive: true });
['pointerup', 'pointercancel', 'touchend'].forEach(ev => addEventListener(ev, () => { spotOn = false; spot.classList.remove('on'); }, { passive: true }));

// ---------- swipe anywhere on the screen to turn (not only from the page corner) ----------
let sw = null, libFlipped = false;
pf.on('changeState', e => { if (e.data !== 'read') libFlipped = true; });
const swStart = (x, y, t) => { if (t && t.closest && (t.closest('.bar') || t.closest('#toc') || t.closest('#reader') || t.closest('#vbox'))) { sw = null; return; } sw = { x, y, t: Date.now() }; libFlipped = false; };
const swEnd = (x, y) => {
  if (!sw) return; const dx = x - sw.x, dy = y - sw.y, dt = Date.now() - sw.t; sw = null;
  if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx) || dt > 900) return;
  const idx0 = pf.getCurrentPageIndex(), go = () => (dx > 0 ? api.next() : api.prev());
  setTimeout(() => {
    if (!libFlipped) return go();
    setTimeout(() => { if (pf.getCurrentPageIndex() === idx0 && pf.getState() === 'read') go(); }, 950);   // engine folded but sprang back
  }, 90);   // RTL: swipe right = next page
};
const inStage = t => t && t.closest && t.closest('#stage');
document.addEventListener('touchstart', e => { if (!inStage(e.target)) { sw = null; return; } const q = e.touches[0]; swStart(q.clientX, q.clientY, e.target); }, { capture: true, passive: true });
document.addEventListener('touchend', e => { const q = e.changedTouches[0]; swEnd(q.clientX, q.clientY); }, { capture: true, passive: true });
document.addEventListener('mousedown', e => { if (inStage(e.target)) swStart(e.clientX, e.clientY, e.target); else sw = null; }, true);
document.addEventListener('mouseup', e => swEnd(e.clientX, e.clientY), true);

const api = { next: () => pf.flipPrev('top'), prev: () => pf.flipNext('top'), to: p => pf.flip(N - p) };
// ---------- sound: music via <audio> (plays even with the iPhone silent switch), effects via Web Audio ----------
let AC = null, bufs = {}, soundOn = true, unlocked = false;
try { soundOn = localStorage.getItem('adaa-sound') !== 'off'; } catch (e) {}
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const bgm = new Audio('music.mp3'); bgm.loop = true; bgm.preload = 'auto'; bgm.setAttribute('playsinline', '');
const sndB = document.getElementById('snd');
sndB.classList.toggle('off', !soundOn);
const load = async (k, u) => { try { const r = await fetch(u); bufs[k] = await AC.decodeAudioData(await r.arrayBuffer()); } catch (e) {} };
const playMusic = () => { if (soundOn) { const p = bgm.play(); if (p && p.catch) p.catch(() => {}); } };
const stopMusic = () => bgm.pause();
const unlock = () => {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) { AC = new C(); load('flip', 'flip.mp3'); load('click', 'click.mp3'); }
  }
  if (AC) {
    if (AC.state !== 'running') AC.resume();
    try { const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); } catch (e) {}
  }
  if (!unlocked && soundOn && !vbox.classList.contains('on')) playMusic();
  if (!bgm.paused) unlocked = true;
};
function sfx(k) {
  if (!soundOn || !AC || !bufs[k]) return;
  if (AC.state !== 'running') AC.resume();
  const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = k === 'flip' ? 0.7 : 0.4;
  s.buffer = bufs[k]; s.playbackRate.value = 0.94 + Math.random() * 0.12; s.connect(g); g.connect(AC.destination); s.start();
}
['touchend', 'click', 'keydown', 'pointerup'].forEach(ev => document.addEventListener(ev, unlock, { capture: true, passive: true }));
sndB.addEventListener('click', () => {
  soundOn = !soundOn; sndB.classList.toggle('off', !soundOn);
  try { localStorage.setItem('adaa-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  if (soundOn) { playMusic(); sfx('click'); } else stopMusic();
});
document.querySelectorAll('.bar .btn:not(#snd), #rclose').forEach(b => b.addEventListener('click', () => sfx('click')));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { bgm.pause(); if (AC) AC.suspend(); }
  else { if (AC) AC.resume(); if (soundOn && unlocked && !vbox.classList.contains('on')) playMusic(); }
});

// ---------- hotspots: links, page jumps and in-book videos (kept off the page-curl engine) ----------
const vbox = document.getElementById('vbox'), vfr = document.getElementById('vfr'), vclose = document.getElementById('vclose');
const openVideo = u => {
  const id = (u.match(/\/file\/d\/([^/]+)/) || [])[1]; if (!id) return false;
  vfr.src = `https://drive.google.com/file/d/${id}/preview`;
  vbox.classList.add('on'); vclose.style.display = 'grid'; bgm.pause();
  return true;
};
const closeVideo = () => {
  vbox.classList.remove('on'); vclose.style.display = 'none'; vfr.src = 'about:blank';
  if (soundOn) playMusic();
};
vclose.onclick = () => { sfx('click'); closeVideo(); };
vbox.addEventListener('click', e => { if (e.target === vbox) closeVideo(); });
// stop the page-curl engine from grabbing presses that start on a hotspot
['mousedown', 'touchstart', 'pointerdown', 'mouseup', 'touchend', 'pointerup', 'touchmove', 'mousemove'].forEach(ev => document.addEventListener(ev, e => {
  if (e.target.closest && e.target.closest('a.hot')) e.stopPropagation();
}, { capture: true, passive: true }));
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a.hot'); if (!a) return;
  e.stopPropagation(); sfx('click');
  if (a.dataset.go) { e.preventDefault(); api.to(+a.dataset.go); return; }
  if (a.classList.contains('vid') && openVideo(a.href)) { e.preventDefault(); return; }
  // external link (e.g. adaa.gov.sa): let the browser open it in a new tab
}, true);

// ---------- table of contents + share ----------
const toc = document.getElementById('toc');
document.getElementById('menu').onclick = () => toc.classList.add('on');
document.getElementById('tclose').onclick = () => { sfx('click'); toc.classList.remove('on'); };
toc.addEventListener('click', e => {
  const b = e.target.closest('button[data-go]'); if (!b) { if (e.target === toc) toc.classList.remove('on'); return; }
  sfx('click'); toc.classList.remove('on'); setTimeout(() => api.to(+b.dataset.go), 150);
});
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };
document.getElementById('share').onclick = async () => {
  const url = location.href.split('#')[0];
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('تم نسخ الرابط'); } catch (e) { toast(url); }
};

nextB.onclick = () => api.next();
prevB.onclick = () => api.prev();
addEventListener('keydown', e => {
  if (vbox.classList.contains('on')) { if (e.key === 'Escape') closeVideo(); return; }
  if (toc.classList.contains('on')) { if (e.key === 'Escape') toc.classList.remove('on'); return; }
  if (reader.classList.contains('on')) { if (e.key === 'Escape') closeReader(); return; }
  if (e.key === 'ArrowLeft') api.next(); if (e.key === 'ArrowRight') api.prev();
});

// rebuild cleanly when the phone is rotated or the window changes shape
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  const s = fitSize();
  if (Math.abs(s.h - h) > 40 || Math.abs(s.pw - pw) > 40) location.reload();
}, 250); });

// high-resolution reading view (native pinch-zoom, scroll between pages)
const reader = document.getElementById('reader'), rclose = document.getElementById('rclose');
const openReader = () => {
  if (!reader.childElementCount) reader.innerHTML = Array.from({ length: N }, (_, i) => `<img id="r${i + 1}" src="${srcH(i + 1)}" loading="lazy" alt="صفحة ${i + 1}">`).join('');
  reader.classList.add('on');
  const first = PORTRAIT || cur === 1 || cur === N ? cur : (cur % 2 ? cur - 1 : cur);
  requestAnimationFrame(() => document.getElementById('r' + first).scrollIntoView({ block: 'start' }));
};
const closeReader = () => reader.classList.remove('on');
document.getElementById('zoom').onclick = openReader;
rclose.onclick = closeReader;
document.getElementById('full').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
}
</script>
</body>
</html>
