<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نمكّن الأداء</title>
<link rel="preload" as="image" href="m-01.jpg">
<style>
:root{color-scheme:dark;--ink:#efe7da;--mut:#c9bfae}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;
  background:#020806 url(bg_main.jpg) center/cover no-repeat;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:90px 0 240px 0;display:grid;place-items:center}
.wrap{position:relative;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
#glow{position:absolute;top:0;height:100%;border-radius:2px;pointer-events:none;
  box-shadow:0 0 16px 3px rgba(255,255,255,.55),0 0 48px 8px rgba(255,255,255,.22),0 0 110px 10px rgba(255,255,255,.08);
  transition:left .8s cubic-bezier(.3,.7,.2,1),width .8s cubic-bezier(.3,.7,.2,1)}
#book{position:relative}
.page{background:#0b3a33;overflow:hidden}
.page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none;background:#0b3a33}
/* magazine spine: soft fold shading where the two pages meet */
.page::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
.page.--left::after{opacity:1;background:linear-gradient(to left,rgba(0,0,0,.28),rgba(0,0,0,.08) 4%,transparent 9%),linear-gradient(to left,rgba(255,255,255,.10),transparent 1.5%)}
.page.--right::after{opacity:1;background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,.08) 4%,transparent 9%)}
.portrait .page::after{opacity:0!important}
.hot{position:absolute;display:block;z-index:3;border-radius:6px;box-shadow:0 0 0 1px rgba(255,236,200,.35),0 0 10px 1px rgba(255,236,200,.25);animation:hotglow 2.6s ease-in-out infinite}
.hot:hover,.hot:active{background:rgba(255,255,255,.14)}
@keyframes hotglow{0%,100%{box-shadow:0 0 0 1px rgba(255,236,200,.12),0 0 4px 0 rgba(255,236,200,.08)}50%{box-shadow:0 0 0 1px rgba(255,236,200,.55),0 0 14px 3px rgba(255,236,200,.35)}}
.hot.vid::after{content:"";position:absolute;inset:0;margin:auto;width:42px;height:42px;max-width:60%;max-height:60%;border-radius:50%;background:rgba(255,255,255,.0)}
@media(prefers-reduced-motion:reduce){.hot{animation:none}}
/* in-book video player */
#vbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:none;place-items:center;padding:16px}
#vbox.on{display:grid}
#vbox .frame{width:min(960px,100%);aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 0 18px 3px rgba(255,255,255,.35)}
#vbox iframe{width:100%;height:100%;border:0}
#vclose{position:fixed;top:12px;left:12px;z-index:31;background:rgba(0,0,0,.6)}
#toc{position:fixed;inset:0;z-index:25;background:rgba(2,8,6,.9);display:none;overflow-y:auto;padding:64px 18px 24px}
#toc.on{display:block}
#toc h2{margin:0 auto 14px;max-width:520px;font-size:20px;font-weight:600;color:var(--ink)}
#toc ol{list-style:none;margin:0 auto;padding:0;max-width:520px}
#toc li button{width:100%;display:flex;align-items:center;gap:14px;padding:13px 14px;margin:0 0 8px;border:1px solid rgba(239,231,218,.18);border-radius:10px;background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:16px;text-align:right;cursor:pointer}
#toc li button:active,#toc li button:hover{background:rgba(255,255,255,.1);box-shadow:0 0 12px 1px rgba(255,236,200,.25)}
#toc .n{color:var(--mut);font-variant-numeric:tabular-nums;min-width:26px;direction:ltr}
#tclose{position:fixed;top:12px;left:12px;z-index:26;background:rgba(0,0,0,.6);display:none}
#toc.on + #tclose{display:grid}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:40;background:rgba(0,0,0,.8);color:var(--ink);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
#snd.off svg .w{display:none}
#snd:not(.off) svg .x{display:none}
.bar{position:fixed;inset:auto 0 165px 0;height:64px;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,231,218,.3);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.btn:disabled{opacity:.3;cursor:default}.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn svg{width:20px;height:20px}
.count{min-width:86px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hint{position:fixed;inset:auto 12px 104px 12px;text-align:center;color:var(--mut);font-size:13px;pointer-events:none;transition:opacity .6s;text-shadow:0 1px 3px #000}
/* high-resolution reading view */
#reader{position:fixed;inset:0;z-index:20;background:rgba(2,8,6,.97);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:56px 0 24px}
#reader.on{display:block}
#reader img{display:block;width:min(100%,1100px);height:auto;margin:0 auto 14px;aspect-ratio:2409/3411;background:#0b3a33;box-shadow:0 0 14px 2px rgba(255,255,255,.35)}
#rclose{position:fixed;top:10px;left:10px;z-index:21;background:rgba(0,0,0,.55);display:none}
#reader.on + #rclose{display:grid}
@media(min-width:700px){.stage{inset:20px 0 170px 0}}
@media(max-width:560px){.full{display:none}.bar{gap:6px;padding:0 6px}.count{min-width:58px;font-size:14px}.btn{width:40px;height:40px}.btn svg{width:18px;height:18px}}
@media(orientation:landscape) and (max-height:500px){.bar{bottom:100px}.stage{inset:4px 0 76px 0}.bar{height:52px}.hint{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="wrap" id="wrap"><div id="glow"></div><div id="book"></div></div></div>
<p class="hint" id="hint">اسحب طرف الصفحة لتقليبها · اقلب الجوال بالعرض لعرض أكبر · العدسة للقراءة بدقة عالية</p>

  <button class="btn" id="next" aria-label="الصفحة التالية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg></button>

  <button class="btn" id="share" aria-label="مشاركة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 12v7h12v-7"/></svg></button>
  <button class="btn" id="snd" aria-label="الصوت"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 10l4 4M20 10l-4 4"/></svg></button>
  <button class="btn full" id="full" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<div id="reader" aria-label="قراءة بدقة عالية"></div>
<button class="btn" id="rclose" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div id="toc" aria-label="الفهرس"><h2>الفهرس</h2><ol>
<li><button data-go="1"><span class="n">01</span>الغلاف</button></li>
<li><button data-go="2"><span class="n">02</span>لماذا التمكين</button></li>
<li><button data-go="3"><span class="n">03</span>عام 2026 بالأرقام</button></li>
<li><button data-go="4"><span class="n">04</span>خريطة المنتجات</button></li>
<li><button data-go="5"><span class="n">05</span>المسار الأول · بناء المهارات</button></li>
<li><button data-go="6"><span class="n">06</span>المسار الثاني · نشر الوعي</button></li>
<li><button data-go="7"><span class="n">07</span>المسار الثالث · تبادل الخبرات</button></li>
<li><button data-go="8"><span class="n">08</span>المسار الرابع · معالجة التعثرات</button></li>
<li><button data-go="9"><span class="n">09</span>المسار الخامس · القنوات المعرفية</button></li>
<li><button data-go="10"><span class="n">10</span>مسارات تأهيل جديدة</button></li>
<li><button data-go="11"><span class="n">11</span>أي منتج يناسب احتياج جهتكم؟</button></li>
</ol></div>
<button class="btn" id="tclose" aria-label="إغلاق الفهرس"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div class="toast" id="toast"></div>
<div id="vbox" role="dialog" aria-label="المقطع"><div class="frame"><iframe id="vfr" allow="autoplay; fullscreen" allowfullscreen></iframe></div></div>
<button class="btn" id="vclose" aria-label="إغلاق" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<script src="page-flip.browser.js"></script>
<script>
{
const HS = [[{"b": [86.31, 90.42, 2.41, 1.7], "g": 3}, {"b": [82.83, 89.82, 9.35, 2.89], "g": 3}, {"b": [76.94, 90.42, 2.41, 1.7], "g": 4}, {"b": [73.46, 89.82, 9.35, 2.89], "g": 4}, {"b": [67.57, 90.42, 2.41, 1.7], "g": 5}, {"b": [64.09, 89.82, 9.35, 2.89], "g": 5}, {"b": [58.2, 90.42, 2.41, 1.7], "g": 6}, {"b": [54.72, 89.82, 9.35, 2.89], "g": 6}, {"b": [48.82, 90.42, 2.41, 1.7], "g": 7}, {"b": [45.35, 89.82, 9.35, 2.89], "g": 7}, {"b": [39.45, 90.42, 2.41, 1.7], "g": 8}, {"b": [35.98, 89.82, 9.35, 2.89], "g": 8}, {"b": [30.08, 90.42, 2.41, 1.7], "g": 9}, {"b": [26.61, 89.82, 9.35, 2.89], "g": 9}, {"b": [20.71, 90.42, 2.41, 1.7], "g": 10}, {"b": [17.24, 89.82, 9.35, 2.89], "g": 10}, {"b": [11.34, 90.42, 2.41, 1.7], "g": 11}, {"b": [7.87, 89.82, 9.35, 2.89], "g": 11}], [{"b": [84.94, 94.69, 7.26, 2.74], "g": 1}], [{"b": [7.87, 94.69, 7.26, 2.74], "g": 1}, {"b": [14.85, 8.61, 70.56, 28.81], "u": "https://drive.google.com/file/d/1KrkOnVcKEpGIrNaWVb1eo-Te6n7plUlf/view?usp=drivesdk"}], [{"b": [84.94, 94.69, 7.26, 2.74], "g": 1}, {"b": [58.93, 31.29, 33.27, 12.99], "g": 5}, {"b": [33.09, 38.64, 21.6, 3.08], "g": 5}, {"b": [58.93, 45.13, 33.27, 10.25], "g": 6}, {"b": [58.93, 56.24, 33.27, 11.54], "g": 7}, {"b": [33.09, 60.51, 21.6, 3.08], "g": 7}, {"b": [7.87, 60.51, 21.6, 3.08], "g": 7}, {"b": [7.87, 69.83, 46.81, 3.08], "g": 8}], [{"b": [7.87, 94.69, 7.26, 2.74], "g": 1}, {"b": [10.51, 78.99, 33.26, 14.51], "u": "https://drive.google.com/file/d/1r_5RxNo4UpsBV53Rau-xEfaV8tJSxOLb/view?usp=drivesdk"}], [{"b": [84.94, 94.69, 7.26, 2.74], "g": 1}], [{"b": [7.87, 94.69, 7.26, 2.74], "g": 1}], [{"b": [84.94, 94.69, 7.26, 2.74], "g": 1}], [{"b": [7.87, 94.69, 7.26, 2.74], "g": 1}], [{"b": [84.94, 94.69, 7.26, 2.74], "g": 1}], [{"b": [7.87, 94.52, 7.26, 2.55], "g": 1}, {"b": [52.76, 44.28, 39.46, 6.48], "g": 5}, {"b": [52.76, 50.77, 39.46, 6.48], "g": 5}, {"b": [52.76, 57.27, 39.46, 6.48], "g": 5}, {"b": [52.76, 63.76, 39.46, 6.48], "g": 5}, {"b": [52.76, 70.26, 39.46, 6.48], "g": 6}, {"b": [52.76, 76.75, 39.46, 6.48], "g": 6}, {"b": [7.87, 44.28, 39.46, 6.48], "g": 7}, {"b": [7.87, 50.77, 39.46, 6.48], "g": 7}, {"b": [7.87, 57.27, 39.46, 6.48], "g": 7}, {"b": [7.87, 63.76, 39.46, 6.48], "g": 7}, {"b": [7.87, 70.26, 39.46, 6.48], "g": 8}, {"b": [7.87, 76.75, 39.46, 6.48], "g": 9}], [{"b": [68.0, 88.54, 24.19, 2.89], "u": "https://adaa.gov.sa/"}]];
const N = 12, PW = 2409, PH = 3411, RATIO = PW / PH;
const book = document.getElementById('book'), wrap = document.getElementById('wrap'), glow = document.getElementById('glow');
const srcM = p => `m-${String(p).padStart(2, '0')}.jpg`, srcH = p => `hi-${String(p).padStart(2, '0')}.jpg`;
const hot = p => (HS[p - 1] || []).map(h => {
  const [x, y, w, hh] = h.b, st = `left:${x}%;top:${y}%;width:${w}%;height:${hh}%`;
  return h.u ? `<a class="hot${/drive\.google\.com\/file\/d\//.test(h.u) ? ' vid' : ''}" style="${st}" href="${h.u}" target="_blank" rel="noopener" aria-label="${/drive\.google/.test(h.u) ? 'تشغيل المقطع' : 'فتح الرابط'}"></a>`
             : `<a class="hot" style="${st}" href="#" data-go="${h.g}" aria-label="انتقال إلى صفحة ${h.g}"></a>`;
}).join('');
const PORTRAIT = false; // always show facing pages (covers stay single)
if (PORTRAIT) document.body.classList.add('portrait');
const barH = () => (innerHeight <= 500 && innerWidth > innerHeight ? 78 : innerWidth >= 700 ? 190 : 330);
const fitSize = () => {
  const aw = innerWidth * (PORTRAIT ? 0.92 : 0.95), ah = (innerHeight - barH()) * (PORTRAIT ? 0.9 : 0.92);
  const per = PORTRAIT ? 1 : 2;
  let h = ah, w = h * RATIO * per;
  if (w > aw) { w = aw; h = w / (RATIO * per); }
  return { pw: Math.floor(w / per), h: Math.floor(h) };
};
const count = document.getElementById('count'), prevB = document.getElementById('prev'), nextB = document.getElementById('next');
const label = p => PORTRAIT ? `${p} / ${N}` : ((p === 1 || p === N) ? `${p} / ${N}` : (p % 2 ? `${p - 1}–${p}` : `${p}–${p + 1}`) + ` / ${N}`);
const hideHint = () => document.getElementById('hint').style.opacity = 0;
const startP = Math.min(N, Math.max(1, parseInt((location.hash.match(/p=(\d+)/) || [])[1] || '1', 10)));

// RTL: pages are fed in reverse, index 0 = back cover … index N-1 = front cover
const order = Array.from({ length: N }, (_, i) => N - i);
book.innerHTML = order.map(p => `<div class="page" data-p="${p}" ${p === 1 || p === N ? 'data-density="hard"' : ''}><img data-src="${srcM(p)}" alt="صفحة ${p}" decoding="async">${hot(p)}</div>`).join('');
const imgs = [...book.querySelectorAll('img')];
const loadAround = p => imgs.forEach(im => {
  const q = +im.parentElement.dataset.p;
  if (!im.src && Math.abs(q - p) <= 4) im.src = im.dataset.src;
});

// warm the rest quietly once the first pages are in

  width: pw, height: h, size: 'fixed',

  clickEventForward: true, useMouseEvents: true, swipeDistance: 20,
  startPage: N - startP, autoSize: false, startZIndex: 1

const pageOf = i => N - i;
let cur = startP;
const placeGlow = p => {
  if (PORTRAIT) { glow.style.left = '0px'; glow.style.width = pw + 'px'; return; }

  if (p === 1) { glow.style.left = '0px'; glow.style.width = pw + 'px'; }

  cur = pageOf(pf.getCurrentPageIndex());

const api = { next: () => pf.flipPrev('top'), prev: () => pf.flipNext('top'), to: p => pf.flip(N - p) };

let AC = null, bufs = {}, musicSrc = null, musicGain = null, soundOn = true;

sndB.classList.toggle('off', !soundOn);
const load = async (k, u) => { try { const r = await fetch(u); bufs[k] = await AC.decodeAudioData(await r.arrayBuffer()); } catch (e) {} };

const closeVideo = () => {
  vbox.classList.remove('on'); vclose.style.display = 'none'; vfr.src = 'about:blank';
  if (soundOn && musicGain && AC) musicGain.gain.linearRampToValueAtTime(0.45, AC.currentTime + 1.5);
};
vclose.onclick = () => { sfx('click'); closeVideo(); };
vbox.addEventListener('click', e => { if (e.target === vbox) closeVideo(); });
book.addEventListener('click', e => {
  const a = e.target.closest('a.hot.vid');
  if (a && openVideo(a.href)) { e.preventDefault(); e.stopPropagation(); sfx('click'); }
  else if (e.target.closest('a.hot')) sfx('click');
}, true);

// ---------- table of contents + share ----------
const toc = document.getElementById('toc');
document.getElementById('menu').onclick = () => toc.classList.add('on');
document.getElementById('tclose').onclick = () => { sfx('click'); toc.classList.remove('on'); };
toc.addEventListener('click', e => {
  const b = e.target.closest('button[data-go]'); if (!b) { if (e.target === toc) toc.classList.remove('on'); return; }
  sfx('click'); toc.classList.remove('on'); setTimeout(() => api.to(+b.dataset.go), 150);
});
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };
document.getElementById('share').onclick = async () => {
  const url = location.href.split('#')[0];
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('تم نسخ الرابط'); } catch (e) { toast(url); }
};

nextB.onclick = () => api.next();
prevB.onclick = () => api.prev();
book.addEventListener('click', e => {
  const a = e.target.closest('a.hot[data-go]');
  if (a) { e.preventDefault(); e.stopPropagation(); api.to(+a.dataset.go); }
}, true);
addEventListener('keydown', e => {
  if (vbox.classList.contains('on')) { if (e.key === 'Escape') closeVideo(); return; }
  if (toc.classList.contains('on')) { if (e.key === 'Escape') toc.classList.remove('on'); return; }
  if (reader.classList.contains('on')) { if (e.key === 'Escape') closeReader(); return; }
  if (e.key === 'ArrowLeft') api.next(); if (e.key === 'ArrowRight') api.prev();
});

// rebuild cleanly when the phone is rotated or the window changes shape
let rt;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
  const s = fitSize();
  if (Math.abs(s.h - h) > 40 || Math.abs(s.pw - pw) > 40) location.reload();
}, 250); });

// high-resolution reading view (native pinch-zoom, scroll between pages)
const reader = document.getElementById('reader'), rclose = document.getElementById('rclose');
const openReader = () => {
  if (!reader.childElementCount) reader.innerHTML = Array.from({ length: N }, (_, i) => `<img id="r${i + 1}" src="${srcH(i + 1)}" loading="lazy" alt="صفحة ${i + 1}">`).join('');
  reader.classList.add('on');
  const first = PORTRAIT || cur === 1 || cur === N ? cur : (cur % 2 ? cur - 1 : cur);
  requestAnimationFrame(() => document.getElementById('r' + first).scrollIntoView({ block: 'start' }));
};
const closeReader = () => reader.classList.remove('on');
document.getElementById('zoom').onclick = openReader;
rclose.onclick = closeReader;
document.getElementById('full').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
}
</script>
</body>
